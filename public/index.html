<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NebulaChat</title>
<script src="/socket.io/socket.io.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0A0B0F;--bg2:#131520;--bg3:#1C1E2D;--bg4:#252838;
  --accent:#818CF8;--accent-d:#4F46E5;--green:#34D399;--red:#F87171;
  --text:#E2E8F0;--text2:#94A3B8;--text3:#64748B;--border:#2D3148;
  --rs:8px
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}

/* ─── AUTH ─── */
#auth-screen{
  display:flex;align-items:center;justify-content:center;height:100vh;
  background:radial-gradient(ellipse at 20% 50%,#1a1060 0%,transparent 60%),
             radial-gradient(ellipse at 80% 20%,#0c1a40 0%,transparent 60%),var(--bg)
}
.auth-card{width:400px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:40px;box-shadow:0 25px 60px rgba(0,0,0,.5)}
.auth-logo{text-align:center;margin-bottom:32px}
.auth-logo h1{font-size:26px;font-weight:700;background:linear-gradient(135deg,#818CF8,#34D399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.auth-logo p{color:var(--text3);font-size:13px;margin-top:4px}
.auth-tabs{display:flex;background:var(--bg3);border-radius:var(--rs);padding:4px;margin-bottom:24px}
.auth-tab{flex:1;padding:8px;text-align:center;font-size:14px;font-weight:500;color:var(--text3);cursor:pointer;border-radius:6px;transition:all .2s}
.auth-tab.active{background:var(--accent);color:#fff}
.fg{margin-bottom:16px}
.fl{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.fi{width:100%;padding:11px 14px;background:var(--bg4);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .2s}
.fi:focus{border-color:var(--accent)}
.fi::placeholder{color:var(--text3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border:none;border-radius:var(--rs);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}
.btn-p{background:var(--accent);color:#fff;width:100%;margin-top:8px}
.btn-p:hover{background:var(--accent-d)}
.btn-p:disabled{opacity:.5;cursor:not-allowed}
.btn-g{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-g:hover{background:var(--bg3);color:var(--text)}
.btn-d{background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.3)}
.btn-d:hover{background:rgba(248,113,113,.22)}
.err{color:var(--red);font-size:12px;margin-top:8px;padding:8px 12px;background:rgba(248,113,113,.1);border-radius:6px;display:none}
.suc{color:var(--green);font-size:12px;margin-top:8px;padding:8px 12px;background:rgba(52,211,153,.1);border-radius:6px;display:none}

/* ─── APP ─── */
#app-screen{display:none;height:100vh}
#app-screen.on{display:flex}

.sbl{width:240px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sbh{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sbt{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3)}
.ic-btn{width:28px;height:28px;border-radius:6px;border:none;background:transparent;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s;flex-shrink:0}
.ic-btn:hover{background:var(--bg3);color:var(--text)}
.rooms-list{flex:1;overflow-y:auto;padding:8px}
.room-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--rs);cursor:pointer;color:var(--text3);font-size:14px;font-weight:500;transition:all .15s;position:relative;margin-bottom:2px}
.room-item:hover{background:var(--bg3);color:var(--text2)}
.room-item.active{background:rgba(129,140,248,.15);color:var(--accent)}
.room-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:60%;background:var(--accent);border-radius:0 3px 3px 0}
.rname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rdel{width:22px;height:22px;border-radius:4px;border:none;background:transparent;color:var(--red);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:13px;opacity:0;transition:opacity .2s;flex-shrink:0}
.room-item:hover .rdel{display:flex;opacity:.6}
.rdel:hover{opacity:1!important;background:rgba(248,113,113,.15)}
.user-strip{padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.uav{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.uinfo{flex:1;min-width:0}
.uname{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ustatus{font-size:11px;color:var(--green);display:flex;align-items:center;gap:4px}
.ustatus::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green)}
.uactions{display:flex;gap:2px}

.chat-main{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.ch-room{font-size:15px;font-weight:600}
.chat-msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:2px}
.msg-group{display:flex;gap:12px;margin-bottom:10px}
.mav{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;margin-top:2px}
.mbody{flex:1;min-width:0}
.mhead{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.muser{font-size:13px;font-weight:600}
.mtime{font-size:11px;color:var(--text3)}
.mtext{font-size:14px;color:var(--text2);line-height:1.55;word-break:break-word;background:var(--bg3);padding:8px 12px;border-radius:0 10px 10px 10px;display:inline-block;max-width:100%;white-space:pre-wrap}
.msg-group.own{flex-direction:row-reverse}
.msg-group.own .mbody{display:flex;flex-direction:column;align-items:flex-end}
.msg-group.own .mhead{flex-direction:row-reverse}
.msg-group.own .mtext{background:var(--accent-d);color:#fff;border-radius:10px 0 10px 10px}
.chat-input-area{padding:14px 20px;border-top:1px solid var(--border)}
.ci-wrap{display:flex;gap:10px;align-items:flex-end;background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:10px 12px;transition:border-color .2s}
.ci-wrap:focus-within{border-color:var(--accent)}
.ci{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14px;font-family:inherit;resize:none;max-height:120px;line-height:1.5}
.ci::placeholder{color:var(--text3)}
.send-btn{width:34px;height:34px;border-radius:8px;border:none;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s}
.send-btn:hover{background:var(--accent-d)}
.no-room{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text3);gap:12px}
.sysmsg{text-align:center;font-size:12px;color:var(--text3);padding:10px}

.sbr{width:200px;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.online-hd{padding:14px 16px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3)}
.online-list{flex:1;overflow-y:auto;padding:8px}
.ou{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px}
.ou-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;position:relative;flex-shrink:0}
.online-dot{position:absolute;bottom:0;right:0;width:8px;height:8px;border-radius:50%;background:var(--green);border:2px solid var(--bg2)}
.ou-name{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:1000}
.overlay.on{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:20px;width:440px;max-height:82vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.5)}
.modal-hd{padding:24px 28px 0;display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:17px;font-weight:700}
.modal-body{padding:20px 28px 28px}
.msec{margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid var(--border)}
.msec:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.msec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:12px}
.irow{display:flex;gap:8px}
.irow .fi{flex:1}

.toast{position:fixed;bottom:24px;right:24px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:13px;color:var(--text);z-index:9999;transform:translateY(80px);opacity:0;transition:all .3s;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.on{transform:translateY(0);opacity:1}
.toast.s{border-color:var(--green);color:var(--green)}
.toast.e{border-color:var(--red);color:var(--red)}
.date-divider{display:flex;align-items:center;gap:12px;margin:12px 0;color:var(--text3);font-size:11px}
.date-divider::before,.date-divider::after{content:'';flex:1;height:1px;background:var(--border)}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.conn-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);padding:3px 8px;border-radius:20px;background:var(--bg3);margin-left:auto}
.conn-badge.on{color:var(--green)}
.conn-badge.on::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green)}
.conn-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--red)}
</style>
</head>
<body>

<!-- ══ AUTH ══ -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <h1>✦ NebulaChat</h1>
      <p>リアルタイムチャットプラットフォーム</p>
    </div>
    <div class="auth-tabs">
      <div class="auth-tab active" onclick="switchTab('login')">ログイン</div>
      <div class="auth-tab" onclick="switchTab('register')">アカウント登録</div>
    </div>
    <div id="login-form">
      <div class="fg"><label class="fl">メールアドレス</label>
        <input class="fi" id="l-email" type="email" placeholder="you@example.com"></div>
      <div class="fg"><label class="fl">パスワード</label>
        <input class="fi" id="l-pass" type="password" placeholder="••••••••"
               onkeydown="if(event.key==='Enter')doLogin()"></div>
      <div id="l-err" class="err"></div>
      <button class="btn btn-p" id="l-btn" onclick="doLogin()">ログイン</button>
    </div>
    <div id="register-form" style="display:none">
      <div class="fg"><label class="fl">ユーザー名</label>
        <input class="fi" id="r-user" type="text" placeholder="yamada_taro"></div>
      <div class="fg"><label class="fl">メールアドレス</label>
        <input class="fi" id="r-email" type="email" placeholder="you@example.com"></div>
      <div class="fg"><label class="fl">パスワード（6文字以上）</label>
        <input class="fi" id="r-pass" type="password" placeholder="••••••••"></div>
      <div class="fg"><label class="fl">パスワード（確認）</label>
        <input class="fi" id="r-conf" type="password" placeholder="••••••••"
               onkeydown="if(event.key==='Enter')doRegister()"></div>
      <div id="r-err" class="err"></div>
      <button class="btn btn-p" id="r-btn" onclick="doRegister()">アカウントを作成</button>
    </div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app-screen">
  <div class="sbl">
    <div class="sbh">
      <span class="sbt">ルーム一覧</span>
      <button class="ic-btn" title="ルームを作成" onclick="openModal('m-create')">＋</button>
    </div>
    <div class="rooms-list" id="rooms-list"></div>
    <div class="user-strip">
      <div class="uav" id="my-av"></div>
      <div class="uinfo">
        <div class="uname" id="my-name"></div>
        <div class="ustatus">オンライン</div>
      </div>
      <div class="uactions">
        <button class="ic-btn" title="設定" onclick="openSettings()">⚙</button>
        <button class="ic-btn" title="ログアウト" onclick="doLogout()">⏻</button>
      </div>
    </div>
  </div>

  <div class="chat-main">
    <div class="no-room" id="no-room">
      <div style="font-size:44px">💬</div>
      <p style="font-size:14px">ルームを選んでチャットを開始</p>
    </div>
    <div id="chat-area" style="display:none;flex-direction:column;height:100%">
      <div class="chat-header">
        <span style="font-size:16px;color:var(--text3)">#</span>
        <span class="ch-room" id="ch-room-name"></span>
        <span class="conn-badge" id="conn-badge">接続中...</span>
      </div>
      <div class="chat-msgs" id="chat-msgs"></div>
      <div class="chat-input-area">
        <div class="ci-wrap">
          <textarea class="ci" id="ci" rows="1" placeholder="メッセージを入力… (Shift+Enterで改行)"></textarea>
          <button class="send-btn" onclick="sendMsg()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="sbr">
    <div class="online-hd">オンライン — <span id="online-count">0</span>人</div>
    <div class="online-list" id="online-list"></div>
  </div>
</div>

<!-- Create Room Modal -->
<div class="overlay" id="m-create">
  <div class="modal">
    <div class="modal-hd">
      <span class="modal-title">ルームを作成</span>
      <button class="ic-btn" onclick="closeModal('m-create')">✕</button>
    </div>
    <div class="modal-body">
      <div class="fg"><label class="fl">ルーム名</label>
        <input class="fi" id="new-room" type="text" placeholder="例: design, dev-talk …"
               onkeydown="if(event.key==='Enter')doCreateRoom()"></div>
      <div id="cr-err" class="err"></div>
      <button class="btn btn-p" style="margin-top:4px" onclick="doCreateRoom()">作成する</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="overlay" id="m-settings">
  <div class="modal">
    <div class="modal-hd">
      <span class="modal-title">⚙ アカウント設定</span>
      <button class="ic-btn" onclick="closeModal('m-settings')">✕</button>
    </div>
    <div class="modal-body">
      <div class="msec">
        <div class="msec-title">ユーザー名の変更</div>
        <div class="irow">
          <input class="fi" id="s-uname" type="text" placeholder="新しいユーザー名">
          <button class="btn btn-g" onclick="saveUsername()">変更</button>
        </div>
        <div id="s-uname-ok" class="suc"></div><div id="s-uname-err" class="err"></div>
      </div>
      <div class="msec">
        <div class="msec-title">メールアドレスの変更</div>
        <div class="irow">
          <input class="fi" id="s-email" type="email" placeholder="新しいメールアドレス">
          <button class="btn btn-g" onclick="saveEmail()">変更</button>
        </div>
        <div id="s-email-ok" class="suc"></div><div id="s-email-err" class="err"></div>
      </div>
      <div class="msec">
        <div class="msec-title">パスワードの変更</div>
        <div class="fg"><input class="fi" id="s-curpass" type="password" placeholder="現在のパスワード"></div>
        <div class="fg"><input class="fi" id="s-newpass" type="password" placeholder="新しいパスワード（6文字以上）"></div>
        <div class="fg"><input class="fi" id="s-confpass" type="password" placeholder="新しいパスワード（確認）"></div>
        <button class="btn btn-g" onclick="savePassword()">パスワードを変更</button>
        <div id="s-pass-ok" class="suc"></div><div id="s-pass-err" class="err"></div>
      </div>
      <div class="msec">
        <div class="msec-title" style="color:var(--red)">危険な操作</div>
        <p style="font-size:13px;color:var(--text3);margin-bottom:12px">アカウントを削除すると、全てのデータが失われます。</p>
        <button class="btn btn-d" onclick="deleteAccount()">アカウントを削除する</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══ UTILS ══ */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const initial=n=>n?n[0].toUpperCase():'?';
const COLORS=['#818CF8','#34D399','#F59E0B','#F87171','#60A5FA','#A78BFA','#FB7185','#4ADE80','#22D3EE','#E879F9'];
function ucolor(id){let h=0;for(let c of String(id))h=(h*31+c.charCodeAt(0))&0xFFFFFFFF;return COLORS[Math.abs(h)%COLORS.length]}
function toast(msg,type=''){
  const t=$('toast');t.textContent=msg;t.className='toast '+type+' on';
  clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',3200)
}
function showFb(id,msg,type){
  const el=$(id);if(!el)return;el.textContent=msg;el.className=type==='ok'?'suc':'err';el.style.display='block';
  clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',3500)
}
function fmtTime(ts){return new Date(ts).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}
function fmtDate(ts){return new Date(ts).toLocaleDateString('ja-JP',{month:'long',day:'numeric'})}

/* ══ STATE ══ */
let me=null, token=null, socket=null, curRoom=null, rooms=[];

/* ══ API HELPER ══ */
async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: 'Bearer '+token } : {})
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'エラーが発生しました');
  return data;
}

/* ══ SOCKET ══ */
function connectSocket() {
  if (socket) socket.disconnect();
  socket = io({ auth: { token } });

  socket.on('connect', () => {
    updateConnBadge(true);
    if (curRoom) socket.emit('join_room', curRoom);
  });
  socket.on('disconnect', () => updateConnBadge(false));

  socket.on('new_message',  msg  => { if(msg.room_id===curRoom){ appendMsg(msg); scrollBottom() } });
  socket.on('online_users', list => renderOnline(list));
  socket.on('room_created', room => { rooms.push(room); renderRooms(); });
  socket.on('room_deleted', ({id}) => {
    rooms = rooms.filter(r=>r.id!==id);
    if (curRoom===id) { curRoom=null; showNoRoom(); toast('現在のルームが削除されました','e'); }
    renderRooms();
  });
}

function updateConnBadge(on) {
  const b=$('conn-badge');
  b.textContent = on ? '接続済み' : '切断中...';
  b.className = 'conn-badge'+(on?' on':'');
}

/* ══ AUTH ══ */
function switchTab(tab){
  document.querySelectorAll('.auth-tab').forEach((el,i)=>
    el.classList.toggle('active',(i===0&&tab==='login')||(i===1&&tab==='register')));
  $('login-form').style.display   = tab==='login'    ? 'block':'none';
  $('register-form').style.display= tab==='register' ? 'block':'none';
}

async function doLogin(){
  const btn=$('l-btn');btn.disabled=true;btn.textContent='ログイン中...';
  try {
    const data = await api('POST','/api/login',{email:$('l-email').value,password:$('l-pass').value});
    enterApp(data.token, data.user);
  } catch(e) {
    showFb('l-err', e.message, 'err');
  } finally { btn.disabled=false; btn.textContent='ログイン'; }
}

async function doRegister(){
  if($('r-pass').value !== $('r-conf').value){ showFb('r-err','パスワードが一致しません','err'); return; }
  const btn=$('r-btn');btn.disabled=true;btn.textContent='作成中...';
  try {
    const data = await api('POST','/api/register',{
      username:$('r-user').value, email:$('r-email').value, password:$('r-pass').value
    });
    enterApp(data.token, data.user);
  } catch(e) {
    showFb('r-err', e.message, 'err');
  } finally { btn.disabled=false; btn.textContent='アカウントを作成'; }
}

async function enterApp(tok, user) {
  token=tok; me=user;
  localStorage.setItem('nc_token', tok);
  $('auth-screen').style.display='none';
  $('app-screen').classList.add('on');
  $('my-name').textContent=me.username;
  $('my-av').textContent=initial(me.username);
  $('my-av').style.background=ucolor(me.id);
  try {
    rooms = await api('GET','/api/rooms');
    renderRooms();
  } catch {}
  connectSocket();
  toast('ようこそ '+me.username+' さん！','s');
}

function doLogout(){
  if(socket) socket.disconnect();
  token=null; me=null; curRoom=null; rooms=[];
  localStorage.removeItem('nc_token');
  $('app-screen').classList.remove('on');
  $('auth-screen').style.display='flex';
  $('l-email').value='';$('l-pass').value='';
  toast('ログアウトしました');
}

/* ══ ROOMS ══ */
function renderRooms(){
  $('rooms-list').innerHTML='';
  rooms.forEach(r=>{
    const el=document.createElement('div');
    el.className='room-item'+(r.id===curRoom?' active':'');
    const canDel = r.created_by===me?.id;
    el.innerHTML=`<span style="opacity:.5;font-size:14px">#</span>
      <span class="rname">${esc(r.name)}</span>
      ${canDel?`<button class="rdel" title="削除" onclick="delRoom(event,'${r.id}')">✕</button>`:''}`;
    el.addEventListener('click',()=>selectRoom(r.id));
    $('rooms-list').appendChild(el);
  });
}

async function selectRoom(rid){
  curRoom=rid;
  renderRooms();
  const room=rooms.find(r=>r.id===rid);
  if(!room) return;
  $('no-room').style.display='none';
  const ca=$('chat-area');ca.style.display='flex';
  $('ch-room-name').textContent=room.name;
  $('chat-msgs').innerHTML='<div class="sysmsg">読み込み中...</div>';
  try {
    const msgs = await api('GET',`/api/rooms/${rid}/messages`);
    renderMsgs(msgs);
  } catch { $('chat-msgs').innerHTML='<div class="sysmsg">メッセージの取得に失敗しました</div>'; }
  scrollBottom();
  socket?.emit('join_room', rid);
}

function showNoRoom(){
  $('no-room').style.display='flex';
  $('chat-area').style.display='none';
  $('online-list').innerHTML='';
  $('online-count').textContent='0';
}

async function doCreateRoom(){
  try {
    await api('POST','/api/rooms',{name:$('new-room').value});
    closeModal('m-create');
    $('new-room').value='';
    // room_created event will handle rendering + auto-join
    const newRoom = rooms[rooms.length-1];
    if(newRoom) { toast('#'+newRoom.name+' を作成しました','s'); selectRoom(newRoom.id); }
  } catch(e){ showFb('cr-err',e.message,'err'); }
}

async function delRoom(e, rid){
  e.stopPropagation();
  const room=rooms.find(r=>r.id===rid);
  if(!confirm(`「#${room?.name}」を削除しますか？\nチャット履歴も全て削除されます。`)) return;
  try {
    await api('DELETE',`/api/rooms/${rid}`);
    toast('ルームを削除しました');
  } catch(e){ toast(e.message,'e'); }
}

/* ══ MESSAGES ══ */
function renderMsgs(msgs){
  const c=$('chat-msgs');c.innerHTML='';
  if(!msgs.length){ c.innerHTML='<div class="sysmsg">✨ 最初のメッセージを送りましょう</div>'; return; }
  let lastDate='', lastUid='', lastMin=0;
  msgs.forEach(m=>{
    const d=fmtDate(m.created_at);
    if(d!==lastDate){ lastDate=d; lastUid=''; const dv=document.createElement('div');dv.className='date-divider';dv.textContent=d;c.appendChild(dv); }
    appendMsgEl(m, lastUid===m.user_id && (m.created_at-lastMin)<300000);
    lastUid=m.user_id; lastMin=m.created_at;
  });
}

function appendMsg(m){
  const c=$('chat-msgs');
  const sys=c.querySelector('.sysmsg');if(sys)sys.remove();
  const prev=c.lastElementChild;
  const compact=prev&&prev.dataset.uid===m.user_id&&(m.created_at-(prev.dataset.ts||0))<300000;
  appendMsgEl(m,compact);
}

function appendMsgEl(m, compact){
  const c=$('chat-msgs');
  const isOwn=m.user_id===me.id;
  if(compact){
    const last=c.lastElementChild;
    if(last&&last.dataset.uid===m.user_id){
      const txt=document.createElement('div');txt.className='mtext';txt.style.marginTop='4px';txt.textContent=m.content;
      last.querySelector('.mbody').appendChild(txt);last.dataset.ts=m.created_at;return;
    }
  }
  const col=ucolor(m.user_id);
  const div=document.createElement('div');
  div.className='msg-group'+(isOwn?' own':'');div.dataset.uid=m.user_id;div.dataset.ts=m.created_at;
  div.innerHTML=`<div class="mav" style="background:${col}">${initial(m.username)}</div>
    <div class="mbody">
      <div class="mhead"><span class="muser">${esc(m.username)}</span><span class="mtime">${fmtTime(m.created_at)}</span></div>
      <div class="mtext">${esc(m.content)}</div>
    </div>`;
  c.appendChild(div);
}

function scrollBottom(){ const c=$('chat-msgs');if(c)c.scrollTop=c.scrollHeight; }

function sendMsg(){
  const ci=$('ci'), content=ci.value.trim();
  if(!content||!curRoom||!socket?.connected) return;
  socket.emit('send_message',{roomId:curRoom,content});
  ci.value='';ci.style.height='auto';
}

/* ══ ONLINE USERS ══ */
function renderOnline(list=[]){
  $('online-count').textContent=list.length;
  const ol=$('online-list');ol.innerHTML='';
  list.forEach(u=>{
    const d=document.createElement('div');d.className='ou';
    d.innerHTML=`<div class="ou-av" style="background:${ucolor(u.userId)}">${initial(u.username)}<div class="online-dot"></div></div>
      <span class="ou-name">${esc(u.username)}</span>`;
    ol.appendChild(d);
  });
}

/* ══ SETTINGS ══ */
function openSettings(){
  $('s-uname').value=me.username;$('s-email').value=me.email;
  $('s-curpass').value='';$('s-newpass').value='';$('s-confpass').value='';
  ['s-uname-ok','s-uname-err','s-email-ok','s-email-err','s-pass-ok','s-pass-err']
    .forEach(id=>{const el=$(id);if(el)el.style.display='none'});
  openModal('m-settings');
}

async function saveUsername(){
  try {
    const d=await api('PUT','/api/me/username',{username:$('s-uname').value});
    token=d.token; me.username=d.username; localStorage.setItem('nc_token',token);
    $('my-name').textContent=d.username;$('my-av').textContent=initial(d.username);
    showFb('s-uname-ok','ユーザー名を変更しました','ok');
  } catch(e){ showFb('s-uname-err',e.message,'err'); }
}

async function saveEmail(){
  try {
    const d=await api('PUT','/api/me/email',{email:$('s-email').value});
    token=d.token; me.email=d.email; localStorage.setItem('nc_token',token);
    showFb('s-email-ok','メールアドレスを変更しました','ok');
  } catch(e){ showFb('s-email-err',e.message,'err'); }
}

async function savePassword(){
  if($('s-newpass').value!==$('s-confpass').value){ showFb('s-pass-err','パスワードが一致しません','err'); return; }
  try {
    await api('PUT','/api/me/password',{currentPassword:$('s-curpass').value, newPassword:$('s-newpass').value});
    $('s-curpass').value='';$('s-newpass').value='';$('s-confpass').value='';
    showFb('s-pass-ok','パスワードを変更しました','ok');
  } catch(e){ showFb('s-pass-err',e.message,'err'); }
}

async function deleteAccount(){
  if(!confirm('アカウントを削除しますか？この操作は取り消せません。')) return;
  if(!confirm('本当に削除しますか？')) return;
  try {
    await api('DELETE','/api/me');
    closeModal('m-settings'); doLogout(); toast('アカウントを削除しました');
  } catch(e){ toast(e.message,'e'); }
}

/* ══ MODALS ══ */
function openModal(id){ $(id).classList.add('on'); }
function closeModal(id){ $(id).classList.remove('on'); }
document.querySelectorAll('.overlay').forEach(el=>el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('on')}));

/* ══ INPUT ══ */
$('ci').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()} });
$('ci').addEventListener('input',function(){ this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'; });

/* ══ AUTO-LOGIN ══ */
(async()=>{
  const saved=localStorage.getItem('nc_token');
  if(!saved){ $('auth-screen').style.display='flex'; return; }
  try {
    // verify token by fetching rooms
    token=saved;
    const rooms_data=await api('GET','/api/rooms');
    // decode user from token payload
    const payload=JSON.parse(atob(saved.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    me={id:payload.id, username:payload.username, email:payload.email};
    rooms=rooms_data;
    $('auth-screen').style.display='none';
    $('app-screen').classList.add('on');
    $('my-name').textContent=me.username;
    $('my-av').textContent=initial(me.username);
    $('my-av').style.background=ucolor(me.id);
    renderRooms(); connectSocket();
  } catch {
    localStorage.removeItem('nc_token');
    $('auth-screen').style.display='flex';
  }
})();
</script>
</body>
</html>
